server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # --- Estáticos: nginx los sirve sin molestar a Python ---
    location /static/ {
        alias /data/flask-static/;
    }

    location /django-static/ {
        alias /data/django-static/;
    }

    # --- Admin de Django ---
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass http://django:8000;
    }

    # --- Todo lo demás es Flask (/, /restaurantes, ...) ---
    location / {
        proxy_pass http://web:8000;
    }

    # Si un backend está caído, nginx muestra su página de error
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}